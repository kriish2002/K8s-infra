trigger:
- main

variables:
  azureServiceConnection: 'azure-connection'
  resourceGroup: 'k8s'
  aksCluster: 'K8S-cluster'
  acrName: 'krishaflaskacr2026'
  imageRepository: 'python-flask-app'
  imageTag: '$(Build.BuildId)'
  namespace: 'flask-app'

pool:
  name: 'Azure_Ka_Agent'

stages:

- stage: Build
  displayName: Build and Push Image

  jobs:
  - job: BuildAndPush

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: Build and Push Docker Image
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Building Docker image..."

          az acr build \
            --registry $(acrName) \
            --image $(imageRepository):$(imageTag) \
            --file app/Dockerfile \
            app/

          echo "Image pushed successfully."


- stage: Deploy
  displayName: Deploy to AKS

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployToAKS

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: Deploy to AKS
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          az aks get-credentials \
            --resource-group $(resourceGroup) \
            --name $(aksCluster) \
            --overwrite-existing

          kubectl apply -f namespace.yaml

          kubectl apply -f deployment.yaml

          kubectl apply -f services.yaml

          kubectl set image deployment/flask-app \
            flask-app=$(acrName).azurecr.io/$(imageRepository):$(imageTag) \
            -n $(namespace)

          kubectl rollout status deployment/flask-app -n $(namespace)

          echo "Deployment successful!"

          kubectl get pods -n $(namespace)
          kubectl get svc -n $(namespace)