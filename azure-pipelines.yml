trigger:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'azure-connection'
  resourceGroup: 'k8s'
  aksCluster: 'K8S-cluster'
  acrName: 'krishaflaskacr2026'
  imageRepository: 'python-flask-app'
  imageTag: '$(Build.BuildId)'
  namespace: 'flask-app'

pool:
  name: 'Azure_ka_Agent'

stages:

# =========================
# BUILD AND PUSH IMAGE
# =========================
- stage: Build
  displayName: 'Build and Push Docker Image'

  jobs:
  - job: BuildAndPush
    displayName: 'Build and Push Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr build `
            --registry $(acrName) `
            --image $(imageRepository):$(imageTag) `
            --file app/Dockerfile `
            app/


# =========================
# DEPLOY TO AKS
# =========================
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployToAKS
    displayName: 'Deploy Application to AKS'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          az aks get-credentials `
            --resource-group $(resourceGroup) `
            --name $(aksCluster) `
            --overwrite-existing

          kubectl apply -f namespace.yaml

          kubectl apply -f deployment.yaml

          kubectl apply -f services.yaml

          kubectl set image deployment/flask-app `
            flask-app=$(acrName).azurecr.io/$(imageRepository):$(imageTag) `
            -n $(namespace)

          kubectl rollout status deployment/flask-app -n $(namespace)

          kubectl get pods -n $(namespace)

          kubectl get svc -n $(namespace)