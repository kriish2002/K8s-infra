apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          envFrom:
            - configMapRef:
                name: nginx-config

          ports:
            - containerPort: 80