trigger:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'azure-connection'
  resourceGroup: 'k8s'
  aksCluster: 'K8S-cluster'
  acrName: 'krishaflaskacr2026'
  imageRepository: 'python-flask-app'
  imageTag: '$(Build.BuildId)'
  namespace: 'flask-app'

pool:
  name: 'Azure_ka_Agent'

stages:

# ==========================================
# STAGE 1: BUILD AND PUSH DOCKER IMAGE
# ==========================================
- stage: Build
  displayName: 'Build and Push Docker Image'

  jobs:
  - job: BuildAndPush
    displayName: 'Build and Push Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Login to Azure'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Azure login successful"
          az account show

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "Adding Docker to PATH..."

          $env:Path += ";C:\Users\happi\AppData\Local\Programs\DockerDesktop\resources\bin"

          Write-Host "Checking Docker..."

          docker --version

          Write-Host "Checking Docker Engine..."

          docker version

          Write-Host "Logging in to ACR..."

          az acr login --name $(acrName)

          Write-Host "Building Docker image..."

          docker build `
            -t $(acrName).azurecr.io/$(imageRepository):$(imageTag) `
            -f app/Dockerfile `
            app/

          Write-Host "Pushing Docker image to ACR..."

          docker push $(acrName).azurecr.io/$(imageRepository):$(imageTag)

          Write-Host "Docker image pushed successfully."


# ==========================================
# STAGE 2: DEPLOY TO AKS
# ==========================================
- stage: Deploy
  displayName: 'Deploy to AKS'

  dependsOn: Build

  condition: succeeded()

  jobs:
  - job: DeployToAKS
    displayName: 'Deploy Application to AKS'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Deploy Application to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "Getting AKS credentials..."

          az aks get-credentials `
            --resource-group $(resourceGroup) `
            --name $(aksCluster) `
            --overwrite-existing

          Write-Host "Applying namespace..."

          kubectl apply -f namespace.yaml

          Write-Host "Applying deployment..."

          kubectl apply -f deployment.yaml

          Write-Host "Applying service..."

          kubectl apply -f services.yaml

          Write-Host "Updating application image..."

          kubectl set image deployment/flask-app `
            flask-app=$(acrName).azurecr.io/$(imageRepository):$(imageTag) `
            -n $(namespace)

          Write-Host "Waiting for deployment rollout..."

          kubectl rollout status deployment/flask-app `
            -n $(namespace) `
            --timeout=5m

          Write-Host "Checking pods..."

          kubectl get pods -n $(namespace)

          Write-Host "Checking service..."

          kubectl get svc -n $(namespace)

          Write-Host "AKS deployment completed successfully."